<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>To My Beloved Doreen ❤️</title>
    <style>
        /* Full page Valentine background with pink gradient */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: white;
            text-align: center;
            overflow: hidden;
            height: 100vh; /* full viewport height */
            display: flex;
            justify-content: center; /* horizontal center */
            align-items: center;     /* vertical center */
            background: linear-gradient(to bottom right, #ff9a9e, #fad0c4);
            position: relative;
        }

        /* Her picture overlay (slightly transparent) */
        body::before {
            content: "";
            background-image: url('love.jpeg'); /* her uploaded image */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.3; /* faint so text is readable */
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
        }

        /* Overlay text box */
        .overlay {
            background-color: rgba(0, 0, 0, 0.6); /* makes text readable */
            padding: 50px;
            border-radius: 20px;
            max-width: 700px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 48px;
        }

        p {
            font-size: 22px;
            line-height: 1.6;
            margin: 12px 0;
        }

        .heart {
            font-size: 45px;
            animation: beat 1s infinite;
            margin-top: 20px;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Balloon animation */
        .balloon {
            position: absolute;
            bottom: -70px;
            width: 50px;
            height: 70px;
            border-radius: 50%;
            animation: float 12s infinite ease-in;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(-1000px) translateX(40px); }
        }

        /* Multiple balloon colors */
        .balloon:nth-child(1) { left: 10%; background: #FF6B6B; animation-duration: 14s; }
        .balloon:nth-child(2) { left: 30%; background: #FFD93D; animation-duration: 16s; }
